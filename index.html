<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edgar Muoni · Full-stack developer</title>
    <meta name="description" content="Edgar Muoni, full-stack developer in Tallinn. Vue 3, TypeScript, Rust, C# / .NET and automated testing. An electrician's habit: find the cause before fixing anything.">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

    <!-- Link previews (LinkedIn, Slack, e-mail) read these tags without running any JavaScript.
         The build fills in each page's own title, description and og:* values from
         src/router/pages.ts (see vite.config.ts), so the values below are only used by `npm run dev`. -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Edgar Muoni · Full-stack developer">
    <meta property="og:description" content="Vue 3 · TypeScript · Rust · C# / .NET · Automated testing. Tallinn, Estonia.">
    <meta property="og:url" content="https://edmuoni.github.io/">

    <!-- Set the colour theme before the page paints, so a dark-mode visitor never sees a white
         flash. The same storage key is used by src/composables/useTheme.ts. -->
    <script>
      try {
        var saved = localStorage.getItem('theme')
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="font-family: sans-serif; padding: 16px">
        This site needs JavaScript. You can still reach me at
        <a href="mailto:edgar.muoni@gmail.com">edgar.muoni@gmail.com</a> or see my code at
        <a href="https://github.com/EdMuoni">github.com/EdMuoni</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
