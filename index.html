<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edgar Muoni · Full-stack developer</title>
    <meta name="description" content="Edgar Muoni, a full-stack developer in Tallinn and a former electrician. Vue 3, TypeScript, C# / .NET and Rust.">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

    <!-- Link previews. The pre-render step fills in each page's own values. -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Edgar Muoni · Full-stack developer">
    <meta property="og:description" content="Vue 3 · TypeScript · Rust · C# / .NET · Automated testing. Tallinn, Estonia.">
    <meta property="og:url" content="https://edmuoni.github.io/">
    <meta property="og:image" content="https://edmuoni.github.io/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Edgar Muoni, full-stack developer: the top of the home page, with Ohm, the site's robot mascot.">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Set theme and motion before the first paint so nothing flashes.
         "js" lets the CSS hide text until it is typed in. If the app never starts, it is removed
         after 4 seconds so the text shows anyway. -->
    <script>
      ;(function () {
        var root = document.documentElement
        var theme = null
        var motion = null
        root.classList.add('js')
        try {
          theme = localStorage.getItem('theme')
          motion = localStorage.getItem('motion')
        } catch (e) {}
        if (theme === 'light' || theme === 'dark') root.dataset.theme = theme
        var systemReduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches
        root.dataset.motion = motion === 'off' || (motion !== 'on' && systemReduce) ? 'reduced' : 'on'
        setTimeout(function () {
          if (!root.classList.contains('app-ready')) root.classList.remove('js')
        }, 4000)
      })()
    </script>
  </head>
  <body>
    <div id="app"><!--app-html--></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
